<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - امتثال</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

  <!-- شاشة تسجيل الدخول -->
  <section id="loginScreen" class="admin-login-wrapper">
    <div class="login-card">
      <img src="assets/logo.png" alt="امتثال" class="login-logo">
      <h2 class="login-title">لوحة التحكم</h2>
      <p class="login-subtitle">أدخل كلمة المرور للدخول</p>

      <input type="password" id="passwordInput" class="input-field-admin" placeholder="كلمة المرور" autocomplete="current-password">
      <div class="input-error-admin" id="loginError"></div>

      <button class="btn btn-primary btn-block btn-large" id="btnLogin" style="margin-top: 18px;">
        <span id="btnLoginText">دخول</span>
      </button>
    </div>
  </section>

  <!-- لوحة التحكم -->
  <section id="dashboard" class="hidden">
    <div class="admin-container">

      <div class="admin-header">
        <div class="admin-brand">
          <img src="assets/logo.png" alt="امتثال">
          <div>
            <div class="admin-title">لوحة التحكم - الحضور</div>
            <div class="admin-subtitle" id="todayLabel">-</div>
          </div>
        </div>
        <div class="admin-actions">
          <button class="btn-ghost" id="btnRefresh">🔄 تحديث</button>
          <button class="btn-ghost" id="btnExport">📥 تصدير CSV</button>
          <button class="btn-ghost" id="btnOpenSheet">📋 فتح الشيت</button>
          <button class="btn-ghost" id="btnLogout">🚪 خروج</button>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card green">
          <div class="stat-label">حضور اليوم</div>
          <div class="stat-value" id="statToday">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">إجمالي التسجيلات</div>
          <div class="stat-value" id="statTotal">0</div>
        </div>
        <div class="stat-card blue">
          <div class="stat-label">عدد المدن</div>
          <div class="stat-value" id="statCompanies">0</div>
        </div>
      </div>

      <!-- جدول الحضور -->
      <div class="table-card">
        <div class="table-title">حضور اليوم (الأحدث أولاً)</div>
        <div id="tableContainer">
          <div class="empty-state">
            <div class="empty-state-icon">⏳</div>
            <p>جاري التحميل...</p>
          </div>
        </div>
      </div>

    </div>
  </section>

  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
